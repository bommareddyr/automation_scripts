# ============================================================
# bitbucket.conf — Bitbucket Configuration File
#
# This file is shared and edited independently of the script.
# Do NOT commit to version control if it contains real tokens.
# Add to .gitignore: echo "bitbucket.conf" >> .gitignore
# ============================================================

# ----- Authentication -----
BB_USERNAME="your_username"
BB_TOKEN="your_personal_access_token"

# ----- Bitbucket Server Base URL (no trailing slash) -----
BB_URL="https://www.git.abcint.net"

# ----- REST API Path (latest or versioned) -----
BB_API_PATH="/rest/api/latest"

# ----- Connection timeout in seconds -----
BB_TIMEOUT=15

# ----- Output CSV file path -----
BB_CSV_OUTPUT="./service_versions.csv"

# ============================================================
# PROJECT MNEMONICS AND THEIR SERVICES
#
# List all mnemonic keys (project slugs) space-separated.
# For each mnemonic, define its services as BB_SERVICES_<MNEMONIC>.
#
# URL pattern used by the script:
#   {BB_URL}{BB_API_PATH}/projects/{MNEMONIC}/repos/{service}/browse/{file}
# ============================================================

BB_MNEMONICS="ded dfd"

# Services under mnemonic: ded
BB_SERVICES_ded="auth-service user-service api-gateway"

# Services under mnemonic: dfd
BB_SERVICES_dfd="data-pipeline reporting-service"
